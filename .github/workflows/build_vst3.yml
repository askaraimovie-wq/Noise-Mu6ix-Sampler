name: Build Noise Mu6ix Sampler VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION.txt).Trim()
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 Release
        run: cmake --build build --config Release --target NoiseMu6ixSampler_VST3

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noise_Mu6ix_Sampler_v${{ steps.ver.outputs.version }}_VST3_Windows
          path: build/NoiseMu6ixSampler_artefacts/Release/VST3/
